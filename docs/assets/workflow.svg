<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">agent-sessions workflow</title>
  <desc id="desc">Local export, family signals, pinned requirements, and audited handoff. Data stays on your machine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c232b"/>
      <stop offset="100%" stop-color="#10151a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1 L8 5 L0 9 Z" fill="#7aa8a0"/>
    </marker>
  </defs>
  <rect width="1120" height="320" rx="18" fill="url(#bg)"/>
  <text x="48" y="48" fill="#e8ebe6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">agent-sessions</text>
  <text x="48" y="76" fill="#9aa7a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Local-first continuation for Claude Code · Codex · Cursor</text>
  <text x="860" y="48" fill="#c4b59a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="end">no upload · stdlib only</text>

  <!-- boxes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="48" y="120" width="200" height="120" rx="14" fill="#243039" stroke="#3d4d57"/>
    <text x="148" y="168" fill="#e8ebe6" font-size="16" font-weight="600" text-anchor="middle">Export</text>
    <text x="148" y="194" fill="#9aa7a3" font-size="13" text-anchor="middle">Markdown + JSON</text>
    <text x="148" y="216" fill="#7aa8a0" font-size="12" text-anchor="middle">private archive</text>

    <rect x="312" y="120" width="200" height="120" rx="14" fill="#243039" stroke="#3d4d57"/>
    <text x="412" y="168" fill="#e8ebe6" font-size="16" font-weight="600" text-anchor="middle">Family</text>
    <text x="412" y="194" fill="#9aa7a3" font-size="13" text-anchor="middle">lineage + signals</text>
    <text x="412" y="216" fill="#7aa8a0" font-size="12" text-anchor="middle">cited quotes</text>

    <rect x="576" y="120" width="200" height="120" rx="14" fill="#243039" stroke="#3d4d57"/>
    <text x="676" y="168" fill="#e8ebe6" font-size="16" font-weight="600" text-anchor="middle">Pin</text>
    <text x="676" y="194" fill="#9aa7a3" font-size="13" text-anchor="middle">requirements.json</text>
    <text x="676" y="216" fill="#7aa8a0" font-size="12" text-anchor="middle">exact evidence</text>

    <rect x="840" y="120" width="230" height="120" rx="14" fill="#2a3a36" stroke="#7aa8a0"/>
    <text x="955" y="168" fill="#e8ebe6" font-size="16" font-weight="600" text-anchor="middle">Handoff</text>
    <text x="955" y="194" fill="#9aa7a3" font-size="13" text-anchor="middle">bundle + audit</text>
    <text x="955" y="216" fill="#c4b59a" font-size="12" text-anchor="middle">ready ` verified</text>
  </g>

  <line x1="248" y1="180" x2="312" y2="180" stroke="#7aa8a0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="512" y1="180" x2="576" y2="180" stroke="#7aa8a0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="776" y1="180" x2="840" y2="180" stroke="#7aa8a0" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="48" y="286" fill="#6f7c78" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Synthetic demos only in this repository. Keep real exports outside Git.</text>
</svg>
