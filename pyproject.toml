[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sessions"
version = "0.2.0"
description = "Universal AI agent session exporter — Claude Code, Codex, Cursor"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ali Moradi"}]

[project.scripts]
agent-sessions = "agent_sessions.cli:main"

[tool.setuptools.packages.find]
include = ["agent_sessions*"]
